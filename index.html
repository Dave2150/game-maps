<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#10151d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Game Maps" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <title>Game Maps – Magyarország</title>
  <style>
    :root { color-scheme: dark; --bg:#10151d; --panel:#171f2b; --line:#2b394b; --blue:#42a5ff; --gold:#f4b942; --muted:#9aa9bb; }
    * { box-sizing:border-box }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:#f5f7fb; font-family:system-ui,-apple-system,Segoe UI,sans-serif }
    #map { position:absolute; inset:0; }
    .top { position:absolute; z-index:5; top: max(12px, env(safe-area-inset-top)); left:12px; right:12px; display:flex; gap:8px; align-items:center }
    .brand { background:#111a27ed; border:1px solid var(--line); border-radius:14px; padding:10px 12px; font-weight:800; letter-spacing:.08em; white-space:nowrap; box-shadow:0 8px 28px #0007 }
    .search { flex:1; min-width:0; display:flex; gap:8px; background:#111a27ed; border:1px solid var(--line); border-radius:14px; padding:7px 9px; box-shadow:0 8px 28px #0007 }
    .search input { width:100%; min-width:0; color:white; background:transparent; border:0; outline:0; font-size:14px }
    button { color:white; background:#223249; border:1px solid #3a506b; border-radius:11px; padding:9px 11px; font-weight:700; cursor:pointer }
    button:active { transform:scale(.98) }
    .side { position:absolute; z-index:5; right:12px; top:90px; display:grid; gap:8px }
    .side button { width:44px; height:44px; padding:0; font-size:19px; background:#111a27ed; box-shadow:0 6px 20px #0006 }
    .bottom { position:absolute; z-index:5; left:12px; right:12px; bottom:max(12px,env(safe-area-inset-bottom)); background:#111a27f2; border:1px solid var(--line); border-radius:18px; padding:12px 14px; box-shadow:0 10px 35px #0008 }
    .bottomrow { display:flex; align-items:center; justify-content:space-between; gap:12px }
    .status { color:var(--muted); font-size:12px; margin-top:5px }
    .filters { display:flex; flex-wrap:wrap; gap:7px; margin-top:11px }
    .chip { font-size:12px; padding:7px 9px; border-radius:999px; background:#202d3d; border:1px solid #35465c; color:#dce7f4 }
    .chip.active { border-color:var(--blue); background:#12395c; color:white }
    .marker { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; border:2px solid #e8f2ff; box-shadow:0 4px 12px #0009; font-size:19px; background:#26384f }
    .marker.shop { background:#9a6720 }.marker.fuel { background:#a33b32 }.marker.food { background:#477b48 }.marker.pharmacy { background:#276e86 }
    .maplibregl-ctrl-group { background:#111a27 !important; border:1px solid var(--line) !important }
    .maplibregl-ctrl button { background-color:#111a27 !important }
    .maplibregl-ctrl button span { filter:invert(1) }
    .maplibregl-ctrl-attrib { background:#111a27cc !important; color:#cbd5e1 !important }
    .maplibregl-ctrl-attrib a { color:#8ecbff !important }
    @media (max-width:430px) { .brand { font-size:12px; padding:10px 9px }.search input{font-size:13px}.bottom{padding:11px}.filters{gap:5px} }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="top">
    <div class="brand">⚔ GAME MAPS</div>
    <form class="search" id="searchForm"><input id="searchInput" placeholder="Hely vagy cím keresése…" autocomplete="off"/><button type="submit">⌕</button></form>
  </div>
  <div class="side">
    <button id="locate" title="Saját helyzet">◎</button>
    <button id="zoomIn" title="Nagyítás">＋</button>
    <button id="zoomOut" title="Kicsinyítés">－</button>
  </div>
  <section class="bottom">
    <div class="bottomrow"><div><strong>MAGYARORSZÁG • EXPLORER MODE</strong><div class="status" id="status">Térkép betöltése…</div></div><button id="reset">HU</button></div>
    <div class="filters">
      <button class="chip active" data-kind="all">✦ Összes</button>
      <button class="chip active" data-kind="shop">🛒 Boltok</button>
      <button class="chip active" data-kind="fuel">⛽ Benzinkút</button>
      <button class="chip active" data-kind="food">🍺 Éttermek</button>
      <button class="chip active" data-kind="pharmacy">✚ Gyógyszertár</button>
    </div>
  </section>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [19.2, 47.2], zoom: 6.3, pitch: 35, bearing: 0,
    attributionControl: true
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:true}), 'bottom-right');
  map.on('load', () => { statusEl.textContent = 'Térkép kész • GPS-re vár'; loadDemoMarkers(); });
  map.on('error', () => { statusEl.textContent = 'Térképhiba – ellenőrizd az internetkapcsolatot'; });
  const markers = [];
  const demo = [
    {name:'Minta kereskedő', coords:[19.0402,47.4979], kind:'shop', icon:'🛒'},
    {name:'Minta benzinkút', coords:[19.055,47.505], kind:'fuel', icon:'⛽'},
    {name:'Minta fogadó', coords:[19.030,47.491], kind:'food', icon:'🍺'},
    {name:'Minta gyógyító', coords:[19.047,47.488], kind:'pharmacy', icon:'✚'}
  ];
  function addMarker(item) {
    const el=document.createElement('div'); el.className='marker '+item.kind; el.textContent=item.icon;
    const popup=new maplibregl.Popup({offset:20}).setHTML(`<strong>${item.name}</strong><br><small>Demó jelölő – nem valós üzletadat</small>`);
    const marker=new maplibregl.Marker({element:el}).setLngLat(item.coords).setPopup(popup).addTo(map);
    markers.push({marker,kind:item.kind});
  }
  function loadDemoMarkers(){ demo.forEach(addMarker); statusEl.textContent='Demó mód • A jelölők mintaadatok, nem valódi üzletek'; }
  document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{
    const kind=btn.dataset.kind;
    if(kind==='all'){
      const active=btn.classList.toggle('active');
      document.querySelectorAll('.chip:not([data-kind="all"])').forEach(x=>x.classList.toggle('active',active));
    } else btn.classList.toggle('active');
    const enabled=new Set([...document.querySelectorAll('.chip.active')].map(x=>x.dataset.kind));
    markers.forEach(x=>x.marker.getElement().style.display=(enabled.has('all')||enabled.has(x.kind))?'grid':'none');
  }));
  document.getElementById('locate').onclick=()=>{
    if(!navigator.geolocation){statusEl.textContent='A böngésző nem támogatja a GPS-t';return;}
    statusEl.textContent='GPS-helyzet lekérése…';
    navigator.geolocation.getCurrentPosition(pos=>{
      const c=[pos.coords.longitude,pos.coords.latitude];
      map.flyTo({center:c,zoom:15,pitch:45});
      new maplibregl.Marker({color:'#42a5ff'}).setLngLat(c).setPopup(new maplibregl.Popup().setText('Itt vagy most')).addTo(map).togglePopup();
      statusEl.textContent='GPS-helyzet sikeresen lekérve';
    },err=>{statusEl.textContent='GPS nem érhető el: '+err.message;},{enableHighAccuracy:true,timeout:12000});
  };
  document.getElementById('zoomIn').onclick=()=>map.zoomIn();
  document.getElementById('zoomOut').onclick=()=>map.zoomOut();
  document.getElementById('reset').onclick=()=>map.flyTo({center:[19.2,47.2],zoom:6.3,pitch:35,bearing:0});
  document.getElementById('searchForm').addEventListener('submit',async e=>{
    e.preventDefault(); const q=document.getElementById('searchInput').value.trim(); if(!q)return;
    statusEl.textContent='Hely keresése…';
    try {
      const url='https://nominatim.openstreetmap.org/search?format=jsonv2&country=Hungary&limit=1&q='+encodeURIComponent(q);
      const res=await fetch(url,{headers:{'Accept-Language':'hu'}}); const data=await res.json();
      if(!data.length){statusEl.textContent='Nem találtam ilyen helyet Magyarországon';return;}
      const p=data[0]; map.flyTo({center:[Number(p.lon),Number(p.lat)],zoom:15,pitch:40});
      statusEl.textContent=p.display_name;
    } catch { statusEl.textContent='A keresés most nem sikerült'; }
  });
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
