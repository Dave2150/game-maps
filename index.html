<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GAME MAPS">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<title>GAME MAPS // Night City</title>
<style>
:root{--bg:#080b16;--panel:#0d1424ee;--line:#26354d;--cyan:#00e5ff;--pink:#ff2bd6;--muted:#91a5bd;--text:#e9f7ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
#map{position:absolute;inset:0;background:#080b16}
.top{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center}
.brand{padding:11px 12px;border:1px solid #00e5ff88;border-radius:12px;background:#091321ed;box-shadow:0 0 18px #00e5ff20;font-size:12px;font-weight:900;letter-spacing:.12em;white-space:nowrap}
.brand b{color:var(--cyan)}
.search{display:flex;gap:6px;flex:1;min-width:0;padding:6px;background:#091321ed;border:1px solid var(--line);border-radius:12px;box-shadow:0 0 18px #0008}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:white;font-size:14px}
button{font:inherit;color:var(--text);background:#142239;border:1px solid #34516d;border-radius:10px;padding:9px 11px;font-weight:750}
button:active{transform:scale(.97)}
.search button{background:#073544;border-color:#00a9c4;color:#bffaff;padding:7px 11px}
.side{position:absolute;z-index:5;right:12px;top:88px;display:grid;gap:8px}
.side button{width:44px;height:44px;padding:0;font-size:20px;background:#091321ed;border-color:#31516b;box-shadow:0 0 15px #00e5ff18}
.bottom{position:absolute;z-index:5;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:12px;background:var(--panel);border:1px solid #28435a;border-radius:16px;box-shadow:0 0 25px #000a,0 0 18px #00e5ff12}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.head strong{font-size:11px;letter-spacing:.1em;color:var(--cyan)}
.status{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.filters{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:1px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:11px;padding:8px 10px;border-radius:999px;background:#111d30;border-color:#2b405a;color:#b7c9dc}
.chip.active{background:#063442;border-color:#00d9f5;color:#d9fcff;box-shadow:0 0 12px #00d9f522}
.poi{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#101b2b;border:1.5px solid var(--cyan);box-shadow:0 0 12px #00e5ff77,0 3px 8px #000b;font-size:18px}
.poi.fuel{border-color:#ffb02e;box-shadow:0 0 12px #ffb02e77}.poi.shop{border-color:#ff2bd6;box-shadow:0 0 12px #ff2bd677}.poi.food{border-color:#b8ff4a;box-shadow:0 0 12px #b8ff4a66}.poi.pharmacy{border-color:#00e5ff}
.poi.user{width:22px;height:22px;border-radius:50%;background:#00e5ff;border:3px solid white;box-shadow:0 0 0 7px #00e5ff33,0 0 20px #00e5ff}
.maplibregl-ctrl-group{background:#0b1422!important;border:1px solid #28435a!important}.maplibregl-ctrl button{background:#0b1422!important}.maplibregl-ctrl button span{filter:invert(1)}.maplibregl-ctrl-attrib{background:#091321cc!important;color:#a9bed3!important}.maplibregl-ctrl-attrib a{color:#00dff5!important}
.maplibregl-popup-content{background:#0c1728;color:#eafaff;border:1px solid #00d9f5;border-radius:10px;box-shadow:0 0 18px #00d9f533;font-family:inherit}.maplibregl-popup-tip{border-top-color:#0c1728!important}
@media(max-width:430px){.brand{font-size:10px;padding:10px 8px}.search input{font-size:12px}.bottom{padding:10px}.head strong{font-size:10px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
 <div class="brand">◈ <b>GAME</b> MAPS</div>
 <form class="search" id="searchForm"><input id="searchInput" placeholder="Hely vagy cím keresése…" autocomplete="off"><button type="submit">⌕</button></form>
</div>
<div class="side">
 <button id="locate" aria-label="Saját helyzet">◎</button>
 <button id="zoomIn" aria-label="Nagyítás">＋</button>
 <button id="zoomOut" aria-label="Kicsinyítés">－</button>
 <button id="tilt" aria-label="Nézet váltása">3D</button>
</div>
<section class="bottom">
 <div class="head"><div><strong>NIGHT CITY // HUNGARY</strong><div class="status" id="status">Térkép betöltése…</div></div><button id="reset">HU</button></div>
 <div class="filters">
  <button class="chip active" data-kind="all">✦ Összes</button>
  <button class="chip active" data-kind="shop">◈ Boltok</button>
  <button class="chip active" data-kind="fuel">⛽ Benzinkút</button>
  <button class="chip active" data-kind="food">◆ Éttermek</button>
  <button class="chip active" data-kind="pharmacy">✚ Gyógyszertár</button>
 </div>
</section>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id), statusEl=$('status');
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/dark',center:[19.2,47.2],zoom:6.2,pitch:38,bearing:-8,attributionControl:true});
map.addControl(new maplibregl.NavigationControl({showCompass:true}),'bottom-right');
let userMarker=null, poiMarkers=[], activeKinds=new Set(['shop','fuel','food','pharmacy']), lastQuery=0, queryTimer=null, is3d=true;
map.on('load',()=>{statusEl.textContent='ONLINE // Valódi térkép betöltve'; schedulePOI();});
map.on('error',()=>{statusEl.textContent='Térképhiba – ellenőrizd az internetkapcsolatot';});
function category(tags){
 if(tags.amenity==='fuel')return 'fuel';
 if(tags.shop || tags.amenity==='marketplace' || tags.shop==='supermarket')return 'shop';
 if(['restaurant','cafe','fast_food','bar','pub','food_court'].includes(tags.amenity))return 'food';
 if(tags.amenity==='pharmacy')return 'pharmacy';
 return null;
}
const icons={shop:'◈',fuel:'⛽',food:'◆',pharmacy:'✚'};
function clearPOI(){poiMarkers.forEach(x=>x.remove());poiMarkers=[];}
function addPOI(el){
 const kind=category(el.tags||{}); if(!kind || !activeKinds.has(kind))return;
 const lat=Number(el.lat ?? el.center?.lat), lon=Number(el.lon ?? el.center?.lon); if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
 const name=el.tags?.name || ({shop:'Üzlet',fuel:'Benzinkút',food:'Vendéglátóhely',pharmacy:'Gyógyszertár'}[kind]);
 const node=document.createElement('div');node.className='poi '+kind;node.textContent=icons[kind];
 const safeName=String(name).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const detail=[el.tags?.['addr:street'],el.tags?.['addr:housenumber'],el.tags?.['addr:city']].filter(Boolean).join(' ');
 const popup=new maplibregl.Popup({offset:18}).setHTML(`<b>${safeName}</b>${detail?`<br><small>${detail}</small>`:''}<br><small>OpenStreetMap-adat</small>`);
 poiMarkers.push(new maplibregl.Marker({element:node}).setLngLat([lon,lat]).setPopup(popup).addTo(map));
}
async function loadPOI(){
 const now=Date.now();if(now-lastQuery<10000)return;lastQuery=now;
 const b=map.getBounds(),s=b.getSouth(),w=b.getWest(),n=b.getNorth(),e=b.getEast();
 if(map.getZoom()<12){statusEl.textContent='Nagyíts közelebb a valódi helyek betöltéséhez';clearPOI();return;}
 statusEl.textContent='Közeli helyek lekérése OpenStreetMapből…';
 const box=`${s},${w},${n},${e}`;
 const query=`[out:json][timeout:15];(node["shop"](${box});way["shop"](${box});relation["shop"](${box});node["amenity"~"fuel|restaurant|cafe|fast_food|bar|pub|pharmacy"](${box});way["amenity"~"fuel|restaurant|cafe|fast_food|bar|pub|pharmacy"](${box});relation["amenity"~"fuel|restaurant|cafe|fast_food|bar|pub|pharmacy"](${box}););out center tags;`;
 try{
  const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(query)});
  if(!r.ok)throw new Error('Overpass '+r.status);
  const data=await r.json();clearPOI();(data.elements||[]).slice(0,180).forEach(addPOI);
  statusEl.textContent=`${poiMarkers.length} valódi hely betöltve • OpenStreetMap`;
 }catch(err){statusEl.textContent='A helyadat-szerver most nem elérhető. Próbáld később.';}
}
function schedulePOI(){clearTimeout(queryTimer);queryTimer=setTimeout(loadPOI,1300);}
map.on('moveend',schedulePOI);
document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{
 const k=btn.dataset.kind;
 if(k==='all'){const on=!btn.classList.contains('active');document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',on));activeKinds=on?new Set(['shop','fuel','food','pharmacy']):new Set();}
 else{btn.classList.toggle('active');if(btn.classList.contains('active'))activeKinds.add(k);else activeKinds.delete(k);document.querySelector('[data-kind="all"]').classList.toggle('active',activeKinds.size===4);}
 clearPOI();schedulePOI();
}));
$('locate').onclick=()=>{
 if(!navigator.geolocation){statusEl.textContent='A böngésző nem támogatja a GPS-t';return;}
 statusEl.textContent='GPS-helyzet lekérése…';
 navigator.geolocation.getCurrentPosition(pos=>{
  const c=[pos.coords.longitude,pos.coords.latitude];
  if(userMarker)userMarker.remove();const el=document.createElement('div');el.className='poi user';
  userMarker=new maplibregl.Marker({element:el}).setLngLat(c).setPopup(new maplibregl.Popup().setText('Jelenlegi helyzeted')).addTo(map);
  map.flyTo({center:c,zoom:15,pitch:50});statusEl.textContent='GPS AKTÍV // Pontosság: ±'+Math.round(pos.coords.accuracy)+' m';
 },err=>statusEl.textContent='GPS-hiba: '+err.message,{enableHighAccuracy:true,timeout:15000,maximumAge:10000});
};
$('zoomIn').onclick=()=>map.zoomIn();$('zoomOut').onclick=()=>map.zoomOut();
$('tilt').onclick=()=>{is3d=!is3d;map.easeTo({pitch:is3d?50:0,bearing:is3d?-8:0});$('tilt').textContent=is3d?'3D':'2D';};
$('reset').onclick=()=>map.flyTo({center:[19.2,47.2],zoom:6.2,pitch:38,bearing:-8});
$('searchForm').addEventListener('submit',async ev=>{
 ev.preventDefault();const q=$('searchInput').value.trim();if(!q)return;statusEl.textContent='Hely keresése…';
 try{const u='https://nominatim.openstreetmap.org/search?format=jsonv2&country=Hungary&limit=1&q='+encodeURIComponent(q);
 const r=await fetch(u,{headers:{'Accept-Language':'hu'}});const d=await r.json();if(!d.length){statusEl.textContent='Nincs találat Magyarországon';return;}
 map.flyTo({center:[+d[0].lon,+d[0].lat],zoom:15,pitch:45});statusEl.textContent=d[0].display_name;
 }catch{statusEl.textContent='A keresés most nem sikerült';}
});
</script>
</body></html>
